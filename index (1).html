<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Griffit: личный журнал сериалов, фильмов, мультфильмов, аниме и игр с оценками, рецензиями, планами, тир-листами и рекомендациями."><title>Griffit: журнал сериалов, фильмов, аниме и игр</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F7;--card:#fff;--ink:#1B2240;--mu:#6B7391;--ln:#D8DDEB;--ac:#E5337A;--ac2:#17A398;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11162B;--card:#1B2240;--ink:#E8EBF5;--mu:#9AA3C0;--ln:#2C3558}}
:root[data-theme="dark"]{--bg:#11162B;--card:#1B2240;--ink:#E8EBF5;--mu:#9AA3C0;--ln:#2C3558}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font:800 clamp(28px,6vw,44px)/1.05 Unbounded,Onest,sans-serif;margin:8px 0 18px;letter-spacing:-.02em}
h2{font:600 20px/1.2 Unbounded,Onest,sans-serif;margin:0}
h3{margin:0 0 4px;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button,.chip{border:1.5px solid var(--ln);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:500}
.nav button.on,.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b1{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:700}
.b2{background:transparent;border:1.5px solid var(--ln);border-radius:10px;padding:8px 14px;font-weight:500}
.b3{background:none;border:0;color:var(--mu);padding:4px 8px;text-decoration:underline;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}.qc{background:var(--card);border:1px solid var(--ln);border-top:5px solid var(--c);border-radius:14px;padding:12px 14px;display:grid;gap:8px}.qc input{border:1.5px solid var(--ln);background:var(--card);border-radius:10px;padding:8px 12px;width:100%}.qc b{font:600 16px Unbounded,Onest,sans-serif}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tools input[type=search],.fm input,.fm select,.fm textarea,.mk input{border:1.5px solid var(--ln);background:var(--card);border-radius:10px;padding:8px 12px;width:100%}
.tools input[type=search]{flex:1;min-width:160px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.it{display:flex;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--ln)}
.cv{flex:0 0 64px;display:grid;place-items:center;color:#fff;font:800 28px Unbounded,sans-serif}
.bd{padding:12px 14px;min-width:0;flex:1}
.tp{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);gap:8px}
.rt{color:var(--ac);font-size:15px}
.bd p{margin:2px 0 8px;font-size:14px;color:var(--mu);overflow-wrap:anywhere}
.ac{display:flex;gap:4px;flex-wrap:wrap;margin-left:-8px}
.em{color:var(--mu);padding:30px 0;grid-column:1/-1}
.mu{color:var(--mu);font-size:14px;margin:4px 0 12px}
.mk{display:flex;gap:8px;margin-bottom:16px}
.lc{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;text-align:left;width:100%}
.hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.hd h2{flex:1;min-width:140px;overflow-wrap:anywhere}
.tr{display:flex;margin-bottom:6px;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--ln)}
.tl{flex:0 0 54px;display:grid;place-items:center;color:#fff;font:800 26px Unbounded,sans-serif}
.tz{flex:1;min-height:54px;display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-content:flex-start}
.pool{background:var(--card);border:1.5px dashed var(--ln);border-radius:10px;margin-top:14px}
.ch{border-radius:8px;padding:5px 10px;font-size:14px;font-weight:500;color:#fff;background:var(--c);cursor:grab;user-select:none;max-width:100%;overflow-wrap:anywhere}
.ch.sel{outline:3px solid var(--ink);outline-offset:1px}
.bn{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bn b{flex:1;min-width:160px}
dialog{border:0;border-radius:16px;padding:0;background:var(--card);color:var(--ink);width:min(440px,92vw)}
dialog::backdrop{background:rgba(10,14,30,.55)}
.fm{padding:20px;display:grid;gap:12px}
.fm label{display:grid;gap:4px;font-size:14px;font-weight:500}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#er{color:var(--ac);font-size:14px;min-height:1em;margin:0}
@media (prefers-reduced-motion:no-preference){.it{transition:transform .15s}.it:hover{transform:translateY(-2px)}}
.ac2{display:block;position:relative}
.sg{position:absolute;left:0;right:0;top:100%;z-index:20;margin-top:4px;background:var(--card);border:1.5px solid var(--ln);border-radius:10px;box-shadow:0 8px 24px rgba(10,14,30,.25);max-height:260px;overflow:auto;display:block}
.sg[hidden]{display:none}
.so{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;font-size:15px;overflow-wrap:anywhere;border-radius:0}
.so:hover,.so.on{background:var(--bg)}
dialog{overflow:visible}
img.cv{object-fit:cover;width:64px}.hb{background:none;border:0;padding:4px;color:var(--ac);line-height:0;border-radius:50%}.hb svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.hb:hover svg,.hb:focus-visible svg{fill:currentColor}
.rh{font:600 18px Unbounded,Onest,sans-serif;margin:22px 0 4px}#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw}#ts[hidden]{display:none}.gh{grid-column:1/-1;margin:10px 0 0;font:600 16px Unbounded,Onest,sans-serif}.br{display:flex;align-items:center;gap:14px;margin:8px 0 20px}.br h1{margin:0;letter-spacing:-.03em}.lg{width:52px;height:52px;flex:none}.tg{margin:2px 0 0;color:var(--mu);font-size:14px}.qh{display:flex;align-items:center;justify-content:space-between;gap:8px}.cnt{min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:var(--c);color:#fff;font:700 14px/30px Unbounded,Onest,sans-serif;text-align:center}.wl{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.wl>div .rh{margin-top:0}
.rc{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
.rc .rh{margin-top:0}.rl{display:grid;gap:10px}.rl .it{background:var(--bg)}
@media (max-width:860px){.wl{grid-template-columns:1fr}.rc{position:static;max-height:460px}}
.it[data-det]{cursor:pointer}
#dd{width:min(720px,94vw);overflow:auto;max-height:90vh}
.dc{display:flex;gap:18px;padding:20px;flex-wrap:wrap}.dc h2{margin:6px 0 8px}
.big{width:240px;max-width:100%;border-radius:12px;object-fit:cover;aspect-ratio:160/226}
.ph{display:grid;place-items:center;color:#fff;font:800 64px Unbounded,sans-serif}
.di{flex:1;min-width:220px}.di p{margin:0 0 12px}
.bk{display:flex;gap:4px;flex-wrap:wrap}.fm [hidden]{display:none}</style></head><body><div class="w">
<header class="br"><svg class="lg" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="var(--ac)"/><path d="M19 14l15 10-15 10z" fill="#fff"/></svg><div><h1>Griffit</h1><p class="tg">Журнал сериалов, фильмов, мультфильмов, аниме и игр</p></div></header>
<div class="top"><div class="nav" id="nav"></div><div class="bk"><button class="b3" data-a="bkx">Сохранить копию</button><button class="b3" data-a="bki">Загрузить копию</button></div></div>
<main id="app"></main></div>

<div id="ts" role="status" hidden></div>
<dialog id="dd"><div id="ddc"></div></dialog>
<dialog id="dlg"><div class="fm"><h2 id="dt"></h2>
<label>Тип<select id="f_type"><option value="series">Сериал</option><option value="film">Фильм</option><option value="game">Игра</option><option value="cartoon">Мультфильм</option><option value="anime">Аниме</option></select></label>
<label>Название<span class="ac2"><input id="f_t" maxlength="80" autocomplete="off"><span class="sg" hidden></span></span></label>
<label>Статус<select id="f_st"><option value="done">Просмотрено или пройдено</option><option value="wish">Планирую посмотреть</option></select></label>
<label id="rw">Оценка: <b id="rv"></b><input type="range" id="f_r" min="1" max="10"></label>
<label id="rvw">Краткая рецензия<textarea id="f_rev" maxlength="400" rows="3"></textarea></label>
<p id="er"></p>
<div class="row"><button class="b2" id="cx">Отмена</button><button class="b1" id="sv">Сохранить</button></div></div></dialog>

<dialog id="dl"><div class="fm"><h2 id="dlt"></h2><p class="mu" id="dlp"></p><textarea id="dlx" rows="4"></textarea><div class="row" id="dlb"></div></div></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TY={series:'Сериал',film:'Фильм',game:'Игра',cartoon:'Мультфильм',anime:'Аниме'},TC={series:'#6C5CE7',film:'#E5337A',game:'#17A398',cartoon:'#F2862B',anime:'#2D8CF0'};
const TIERS=['S','A','B','C','D'],TCOL={S:'#E5484D',A:'#F2862B',B:'#D99A0B',C:'#3F9E6C',D:'#4C8DDB'};
let S={items:[],lists:[],tiers:[]},ui={view:'log',type:'all',q:'',open:null,sel:null,shared:null,edit:null};
const uid=()=>Math.random().toString(36).slice(2,9);
try{const v=localStorage.getItem('mt1');if(v)S=JSON.parse(v)}catch(e){}
const save=()=>{try{localStorage.setItem('mt1',JSON.stringify(S))}catch(e){}};
const item=id=>S.items.find(x=>x.id===id);
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.trim()))));

const cover=i=>COVERS[norm(i.t)]?`<img class="cv" alt="" src="${COVERS[norm(i.t)]}">`:`<div class="cv" style="background:${TC[i.type]}">${esc(i.t.trim().charAt(0).toUpperCase())}</div>`;
const card=(i,x='')=>`<article class="it" data-det="${esc(i.type+'|'+i.t)}">${cover(i)}<div class="bd"><div class="tp"><span>${TY[i.type]}</span>${i.st==='done'?`<b class="rt">${i.r}/10</b>`:'<span>в планах</span>'}</div><h3>${esc(i.t)}</h3>${i.rev&&i.st==='done'?`<p>${esc(i.rev)}</p>`:''}<div class="ac">${x}</div></div></article>`;
const chip=id=>{const i=item(id);return i?`<span class="ch${ui.sel===id?' sel':''}" draggable="true" data-id="${id}" style="--c:${TC[i.type]}">${esc(i.t)}</span>`:''};

function gridHtml(){
  const st=ui.view==='log'?'done':'wish';
  const L=S.items.filter(i=>i.st===st&&(ui.type==='all'||i.type===ui.type)&&i.t.toLowerCase().includes(ui.q.toLowerCase()));
  if(!L.length)return `<p class="em">${st==='done'?'Здесь пока пусто. Добавьте первый сериал, фильм или игру.':'В планах пока пусто. Добавьте то, что собираетесь посмотреть или пройти.'}</p>`;
  const cd=i=>card(i,`<button class="b3" data-a="edit" data-id="${i.id}">Изменить</button>`+(st==='wish'?`<button class="b3" data-a="done" data-id="${i.id}">Готово, оценить</button>`:'')+`<button class="b3" data-a="del" data-id="${i.id}">Удалить</button>`);
  if(st==='wish'&&ui.type==='all')return Object.keys(TY).map(k=>{const g=L.filter(i=>i.type===k);return g.length?`<h3 class="gh">${PL[k]} (${g.length})</h3>`+g.map(cd).join(''):''}).join('');
  return L.map(cd).join('');
}
function logView(){
  const ch=(k,l)=>`<button class="chip${ui.type===k?' on':''}" data-a="type" data-id="${k}">${l}</button>`;
  return `<div class="qa">${['series','film','game','cartoon','anime'].map(k=>`<div class="qc" style="--c:${TC[k]}"><div class="qh"><b>${PL[k]}</b><span class="cnt" title="${ui.view==='wish'?'В планах':'В журнале'}">${cnt(k)}</span></div><span class="ac2"><input id="qa_${k}" maxlength="80" placeholder="Впишите название" autocomplete="off" aria-label="Название: ${TY[k]}"><span class="sg" hidden></span></span><button class="b1" data-a="qadd" data-id="${k}">Добавить</button></div>`).join('')}</div><div class="tools">${ch('all','Все')}${ch('series','Сериалы')}${ch('film','Фильмы')}${ch('game','Игры')}${ch('cartoon','Мультфильмы')}${ch('anime','Аниме')}<input type="search" id="q" placeholder="Поиск по названию" value="${esc(ui.q)}" aria-label="Поиск"></div>${ui.view==='wish'?`<div class="wl"><div><h2 class="rh">Мои планы</h2><div class="grid" id="grid">${gridHtml()}</div></div><aside class="rc">${recs()}</aside></div>`:`<div class="grid" id="grid">${gridHtml()}</div>`}`;
}
function listsView(){
  if(ui.open){
    const l=S.lists.find(x=>x.id===ui.open);if(!l){ui.open=null;return listsView()}
    const ids=l.ids.filter(item),rest=S.items.filter(i=>!l.ids.includes(i.id));
    return `<div class="hd"><button class="b2" data-a="backl">Назад</button><h2>${esc(l.name)}</h2><button class="b2" data-a="sharel">Поделиться</button><button class="b3" data-a="dell">Удалить список</button></div>
    <div class="tools"><select data-chg="addl" aria-label="Добавить в список"><option value="">Добавить из журнала…</option>${rest.map(i=>`<option value="${i.id}">${esc(i.t)} (${TY[i.type]})</option>`).join('')}</select></div>
    <div class="grid">${ids.length?ids.map(id=>{const i=item(id);return card(i,`<button class="b3" data-a="rml" data-id="${id}">Убрать из списка</button>`)}).join(''):'<p class="em">В списке пока ничего нет. Выберите запись выше.</p>'}</div>`;
  }
  return `<div class="mk"><input id="nl" maxlength="60" placeholder="Название нового списка, например «Лучшее за 2026»" aria-label="Название списка"><button class="b1" data-a="newl">Создать</button></div><div class="tools"><button class="b2" data-a="import">Импорт по коду или ссылке</button></div>
  <div class="grid">${S.lists.length?S.lists.map(l=>`<button class="lc" data-a="openl" data-id="${l.id}"><h3>${esc(l.name)}</h3><span class="mu">Записей: ${l.ids.filter(item).length}</span></button>`).join(''):'<p class="em">Списков нет. Создайте первый: например, «Лучшие сериалы» или «Игры на выходные».</p>'}</div>`;
}
function rowsHtml(t,ro){
  return TIERS.map(k=>`<div class="tr"><div class="tl" style="background:${TCOL[k]}">${k}</div><div class="tz" ${ro?'':`data-k="${k}"`}>${t.rows[k].map(ro?(x=>x):chip).join('')}</div></div>`).join('');
}
function tiersView(){
  if(ui.open){
    const t=S.tiers.find(x=>x.id===ui.open);if(!t){ui.open=null;return tiersView()}
    const used=new Set(Object.values(t.rows).flat()),rest=S.items.filter(i=>!used.has(i.id));
    return `<div class="hd"><button class="b2" data-a="backt">Назад</button><h2>${esc(t.name)}</h2><button class="b2" data-a="sharet">Поделиться</button><button class="b3" data-a="delt">Удалить</button></div>
    <p class="mu">Перетащите карточку в нужную строку или нажмите на карточку, затем на строку.</p>${rowsHtml(t)}
    <div class="tools" style="margin-top:14px"><select data-chg="addt" aria-label="Добавить в тир-лист"><option value="">Добавить из журнала…</option>${rest.map(i=>`<option value="${i.id}">${esc(i.t)} (${TY[i.type]})</option>`).join('')}</select></div>
    <div class="tz pool" data-k="P">${t.rows.P.map(chip).join('')||'<span class="mu">Сюда попадают карточки, которые ещё не оценены. Перетащите сюда, чтобы убрать из строки.</span>'}</div>`;
  }
  return `<div class="mk"><input id="nt" maxlength="60" placeholder="Название тир-листа, например «Игры 2026»" aria-label="Название тир-листа"><button class="b1" data-a="newt">Создать</button></div><div class="tools"><button class="b2" data-a="import">Импорт по коду или ссылке</button></div>
  <div class="grid">${S.tiers.length?S.tiers.map(t=>`<button class="lc" data-a="opent" data-id="${t.id}"><h3>${esc(t.name)}</h3><span class="mu">Размещено: ${TIERS.reduce((n,k)=>n+t.rows[k].filter(item).length,0)}</span></button>`).join(''):'<p class="em">Тир-листов нет. Создайте первый и расставьте записи по уровням от S до D.</p>'}</div>`;
}
function sharedView(){
  const p=ui.shared,c=i=>card(i);
  const body=p.k==='l'?`<div class="grid">${p.items.map(c).join('')}</div>`:rowsHtml({rows:Object.fromEntries(TIERS.map(k=>[k,(p.rows[k]||[]).map(n=>p.items[n]?`<span class="ch" style="--c:${TC[p.items[n].type]}">${esc(p.items[n].t)} · ${p.items[n].r||'–'}</span>`:'')])) },true);
  return `<div class="bn"><b>Вам поделились: ${esc(p.n)}</b><button class="b1" data-a="saveshared">Сохранить себе</button><button class="b2" style="color:inherit" data-a="closeshared">Закрыть</button></div>${body}`;
}
function render(){
  const tab=(k,l)=>`<button class="${ui.view===k&&!ui.shared?'on':''}" data-a="nav" data-id="${k}">${l}</button>`;
  $('#nav').innerHTML=tab('log','Журнал')+tab('wish','Планы')+tab('tiers','Тир-листы');
  $('#app').innerHTML=ui.shared?sharedView():({log:logView,wish:logView,lists:listsView,tiers:tiersView})[ui.view]();
}

/* form */
function openForm(id,st){
  const i=item(id)||{type:'series',t:'',st:st||'done',r:8,rev:''};ui.edit=id||null;
  $('#dt').textContent=id?'Изменить запись':'Новая запись';
  $('#f_type').value=i.type;$('#f_t').value=i.t;$('#f_st').value=i.st;$('#f_r').value=i.r||8;$('#f_rev').value=i.rev||'';$('#er').textContent='';
  syncForm();$('#dlg').showModal();$('#f_t').focus();
}
function syncForm(){const w=[...$('#f_st').options].find(o=>o.value==='wish');w.textContent=$('#f_type').value==='game'?'Планирую пройти':'Планирую посмотреть';const d=$('#f_st').value==='done';$('#rw').hidden=$('#rvw').hidden=!d;$('#rv').textContent=$('#f_r').value+'/10'}
$('#f_st').onchange=$('#f_r').oninput=$('#f_type').onchange=syncForm;
$('#cx').onclick=()=>$('#dlg').close();
$('#sv').onclick=()=>{
  const t=$('#f_t').value.trim();if(!t){$('#er').textContent='Введите название.';return}
  const o={type:$('#f_type').value,t,st:$('#f_st').value,r:+$('#f_r').value,rev:$('#f_rev').value.trim()};
  const fin=img=>{if(img)o.img=img;const i=item(ui.edit);if(i)Object.assign(i,o);else S.items.unshift({id:uid(),...o});save();$('#dlg').close();render()};
  return fin();
  const fr=new FileReader(),im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=120;c.height=170;const x=c.getContext('2d'),s=Math.max(120/im.width,170/im.height);x.drawImage(im,(120-im.width*s)/2,(170-im.height*s)/2,im.width*s,im.height*s);fin(c.toDataURL('image/jpeg',.75))};
  im.onerror=()=>fin();fr.onload=()=>{im.src=fr.result};fr.readAsDataURL(f);
};

/* share dialogs */
function tryCopy(s){try{navigator.clipboard.writeText(s)}catch(e){}}
function showShare(code){
  const link=location.href.split('#')[0]+'#s='+code;
  $('#dlt').textContent='Поделиться';$('#dlp').textContent='Отправьте ссылку или код. Получатель откроет их и сохранит список себе. Если копирование не сработало, выделите текст вручную.';
  $('#dlx').value=link;$('#dlx').readOnly=true;
  $('#dlb').innerHTML='<button class="b2" id="cl">Ссылка</button><button class="b2" id="cc">Код</button><button class="b1" id="cz">Закрыть</button>';
  $('#cl').onclick=()=>{$('#dlx').value=link;$('#dlx').select();tryCopy(link)};
  $('#cc').onclick=()=>{$('#dlx').value=code;$('#dlx').select();tryCopy(code)};
  $('#cz').onclick=()=>$('#dl').close();$('#dl').showModal();$('#dlx').select();
}
function showImport(){
  $('#dlt').textContent='Импорт';$('#dlp').textContent='Вставьте код или ссылку, которую вам прислали.';
  $('#dlx').value='';$('#dlx').readOnly=false;
  $('#dlb').innerHTML='<button class="b2" id="cz">Отмена</button><button class="b1" id="co">Открыть</button>';
  $('#cz').onclick=()=>$('#dl').close();
  $('#co').onclick=()=>{try{let v=$('#dlx').value.trim();const n=v.indexOf('#s=');if(n>=0)v=v.slice(n+3);ui.shared=dec(v);$('#dl').close();render()}catch(e){$('#dlp').textContent='Не удалось прочитать код. Проверьте, что он скопирован полностью.'}};
  $('#dl').showModal();
}
const cut=({t,type,r,rev,st})=>({t,type,r,rev,st});
function importShared(){
  const p=ui.shared,ids=p.items.map(x=>{const id=uid();S.items.unshift({id,...cut(x)});return id});
  if(p.k==='l'){const l={id:uid(),name:p.n,ids};S.lists.push(l);ui.view='lists';ui.open=l.id}
  else{const rows={P:[]};TIERS.forEach(k=>rows[k]=(p.rows[k]||[]).map(n=>ids[n]));ids.forEach((id,n)=>{if(!Object.values(rows).flat().includes(id))rows.P.push(id)});const t={id:uid(),name:p.n,rows};S.tiers.push(t);ui.view='tiers';ui.open=t.id}
  closeShared();save();
}
function closeShared(){ui.shared=null;try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){location.hash=''}render()}

/* tier moves */
function move(id,k){const t=S.tiers.find(x=>x.id===ui.open);if(!t||!item(id))return;Object.keys(t.rows).forEach(r=>t.rows[r]=t.rows[r].filter(x=>x!==id));t.rows[k].push(id);ui.sel=null;save();render()}

/* events */
document.addEventListener('click',e=>{
  const dt=e.target.closest('.it[data-det]');if(dt&&!e.target.closest('button,select,input')){showDetail(dt.dataset.det);return}
  const ch=e.target.closest('.ch');
  if(ch&&ch.dataset.id){ui.sel=ui.sel===ch.dataset.id?null:ch.dataset.id;render();return}
  const z=e.target.closest('.tz[data-k]');
  if(z&&ui.sel){move(ui.sel,z.dataset.k);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='nav'){ui.view=id;ui.open=null;ui.sel=null;ui.shared=null;ui.type='all';ui.q=''}
  else if(a==='type')ui.type=id;
  else if(a==='add'){openForm(null,ui.view==='wish'?'wish':'done');return}
  else if(a==='rec'){const[k,...r]=id.split('|');S.items.unshift({id:uid(),type:k,t:r.join('|'),st:'wish',r:0,rev:''});save();toast('«'+r.join('|')+'» добавлено в планы: '+PL[k])}
  else if(a==='qadd'){const v=$('#qa_'+id).value.trim();openForm(null,ui.view==='wish'?'wish':'done');$('#f_type').value=id;$('#f_t').value=v;syncForm();return}
  else if(a==='edit'){openForm(id);return}
  else if(a==='done'){openForm(id);$('#f_st').value='done';syncForm();return}
  else if(a==='del'){S.items=S.items.filter(x=>x.id!==id);S.lists.forEach(l=>l.ids=l.ids.filter(x=>x!==id));S.tiers.forEach(t=>Object.keys(t.rows).forEach(r=>t.rows[r]=t.rows[r].filter(x=>x!==id)));save()}
  else if(a==='newl'){const n=$('#nl').value.trim();if(!n)return $('#nl').focus();const l={id:uid(),name:n,ids:[]};S.lists.push(l);ui.open=l.id;save()}
  else if(a==='newt'){const n=$('#nt').value.trim();if(!n)return $('#nt').focus();const t={id:uid(),name:n,rows:{S:[],A:[],B:[],C:[],D:[],P:[]}};S.tiers.push(t);ui.open=t.id;save()}
  else if(a==='openl'||a==='opent')ui.open=id;
  else if(a==='backl'||a==='backt'){ui.open=null;ui.sel=null}
  else if(a==='dell'){S.lists=S.lists.filter(x=>x.id!==ui.open);ui.open=null;save()}
  else if(a==='delt'){S.tiers=S.tiers.filter(x=>x.id!==ui.open);ui.open=null;save()}
  else if(a==='rml'){const l=S.lists.find(x=>x.id===ui.open);l.ids=l.ids.filter(x=>x!==id);save()}
  else if(a==='sharel'){const l=S.lists.find(x=>x.id===ui.open);showShare(enc({k:'l',n:l.name,items:l.ids.map(item).filter(Boolean).map(cut)}));return}
  else if(a==='sharet'){const t=S.tiers.find(x=>x.id===ui.open),all=[],rows={};TIERS.forEach(k=>rows[k]=t.rows[k].map(item).filter(Boolean).map(i=>all.push(cut(i))-1));showShare(enc({k:'t',n:t.name,items:all,rows}));return}
  else if(a==='bkx'){exportData();return}
  else if(a==='bki'){showImportData();return}
  else if(a==='import'){showImport();return}
  else if(a==='saveshared'){importShared();return}
  else if(a==='closeshared'){closeShared();return}
  render();
});
document.addEventListener('change',e=>{
  const c=e.target.dataset.chg;if(!c||!e.target.value)return;
  if(c==='addl'){S.lists.find(x=>x.id===ui.open).ids.push(e.target.value)}
  if(c==='addt'){S.tiers.find(x=>x.id===ui.open).rows.P.push(e.target.value)}
  save();render();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;$('#grid').innerHTML=gridHtml()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('.ch');if(c&&c.dataset.id)e.dataTransfer.setData('text/plain',c.dataset.id)});
document.addEventListener('dragover',e=>{if(e.target.closest('.tz[data-k]'))e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest('.tz[data-k]');if(!z)return;e.preventDefault();move(e.dataTransfer.getData('text/plain'),z.dataset.k)});
document.addEventListener('keydown',e=>{
  const t=e.target,id=t.id||'';
  if((id==='f_t'||id.startsWith('qa_'))&&sg.inp===t&&sg.list.length&&!sgBox(t).hidden){
    const n=sg.list.length;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sg.i=e.key==='ArrowDown'?(sg.i+1)%n:(sg.i<=0?n-1:sg.i-1);sgBox(t).querySelectorAll('.so').forEach((b,j)=>b.classList.toggle('on',j===sg.i));return}
    if(e.key==='Enter'&&sg.i>=0){e.preventDefault();sgPick(sg.i);return}
    if(e.key==='Escape'){e.preventDefault();sgHide();return}
  }
  if(e.key!=='Enter')return;
  if(id.startsWith('qa_'))document.querySelector('[data-a=qadd][data-id='+id.slice(3)+']').click();
  else if(id==='nl')document.querySelector('[data-a=newl]').click();
  else if(id==='nt')document.querySelector('[data-a=newt]').click();
});

function sgHide(){document.querySelectorAll('.sg').forEach(b=>b.hidden=true);sg.list=[]}
function sgPick(j){const i=sg.inp;i.value=sg.list[j];sgHide();i.focus()}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='f_t'||(t.id||'').startsWith('qa_'))sgShow(t)});
document.addEventListener('mousedown',e=>{const b=e.target.closest('[data-sg]');if(b){e.preventDefault();sgPick(+b.dataset.sg)}else if(!e.target.closest('.sg'))sgHide()});

  $('#ddc').innerHTML=`<div class="dc">${cv?`<img class="big" alt="Обложка: ${esc(t)}" src="${cv}">`:`<div class="big ph" style="background:${TC[k]}">${esc(t.trim().charAt(0).toUpperCase())}</div>`}<div class="di"><div class="tp"><span>${TY[k]}</span></div><h2>${esc(t)}</h2>${rate?`<p class="mu">Оценки критиков: ${rate}</p>`:''}${it&&it.st==='done'?`<p><b class="rt">Моя оценка: ${it.r}/10</b></p>${it.rev?`<p>${esc(it.rev)}</p>`:''}`:''}<p>${d?esc(d):'<span class="mu">Описание для этого названия пока не добавлено.</span>'}</p><div class="row"><button class="b2" id="ddx">Закрыть</button></div></div></div>`;
  $('#ddx').onclick=()=>$('#dd').close();$('#dd').showModal();
}
async function exportData(){
  const data=JSON.stringify({app:'griffit',v:1,items:S.items,lists:S.lists,tiers:S.tiers}),fn='griffit-backup.json';
  try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:fn,data});toast('Копия данных сохранена');return}}catch(e){if(e&&e.code==='declined')return}
  $('#dlt').textContent='Копия данных';$('#dlp').textContent='Скопируйте этот текст и сохраните его, например, в заметки или в файл. Позже вставьте его через «Загрузить копию».';
  $('#dlx').value=data;$('#dlx').readOnly=true;
  $('#dlb').innerHTML='<button class="b2" id="cc">Копировать</button><button class="b1" id="cz">Закрыть</button>';
  $('#cc').onclick=()=>{$('#dlx').select();try{navigator.clipboard.writeText(data)}catch(e){}};
  $('#cz').onclick=()=>$('#dl').close();$('#dl').showModal();$('#dlx').select();
}
function showImportData(){
  $('#dlt').textContent='Загрузить копию';
  $('#dlp').innerHTML='Выберите файл копии или вставьте её текст. Записи добавятся к уже имеющимся, ничего не удалится.<br><input type="file" id="bf" accept=".json,application/json">';
  $('#dlx').value='';$('#dlx').readOnly=false;
  $('#dlb').innerHTML='<button class="b2" id="cz">Отмена</button><button class="b1" id="co">Загрузить</button>';
  $('#bf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#dlx').value=r.result};r.readAsText(f)};
  $('#cz').onclick=()=>$('#dl').close();
  $('#co').onclick=()=>{try{
    const o=JSON.parse($('#dlx').value.trim());if(!o||!Array.isArray(o.items))throw 0;
    const mg=(a,b)=>{const ids=new Set(a.map(x=>x.id));let n=0;(b||[]).forEach(x=>{if(x&&x.id&&!ids.has(x.id)){a.push(x);n++}});return n};
    const n=mg(S.items,o.items);mg(S.lists,o.lists);mg(S.tiers,o.tiers);
    save();$('#dl').close();render();toast('Загружено записей: '+n);
  }catch(e){$('#dlp').textContent='Не удалось прочитать копию. Проверьте, что текст скопирован полностью.'}};
  $('#dl').showModal();
}
function pick(a,n){let s=Math.floor(Date.now()/864e5)+a.length;const r=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function recs(){
  const have=new Set(S.items.map(i=>i.t)),n=ui.type==='all'?6:14;
  const box=Object.keys(RATE).filter(k=>ui.type==='all'||ui.type===k).map(k=>{
    let L=Object.entries(RATE[k]).filter(([t])=>!have.has(t)).sort((a,b)=>sc(k,b[1])-sc(k,a[1])).slice(0,n*2+2);L=pick(L,n).sort((a,b)=>sc(k,b[1])-sc(k,a[1]));
    return L.map(([t,v])=>`<article class="it" data-det="${esc(k+'|'+t)}">${cover({t,type:k})}<div class="bd"><div class="tp"><span>${TY[k]}</span></div><h3>${esc(t)}</h3><p>${k==='game'?`Metacritic ${v[0]} · OpenCritic ${v[1]}`:k==='anime'?`IMDb ${v[0]} · MyAnimeList ${(v[1]/10).toFixed(1)}`:`IMDb ${v[0]} · Rotten Tomatoes ${v[1]}%`}</p><div class="ac"><button class="hb" data-a="rec" data-id="${esc(k+'|'+t)}" aria-label="Добавить в планы" title="Добавить в планы"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button></div></div></article>`).join('');
  }).join('');
  return `<h2 class="rh">Рекомендуем</h2><p class="mu">По оценкам критиков: IMDb и Rotten Tomatoes для кино, сериалов и мультфильмов, Metacritic и OpenCritic для игр, IMDb и MyAnimeList для аниме. Цифры приблизительные. Подборка меняется каждый день.</p><div class="rl">${box||'<p class="em">Нет рекомендаций для этой категории.</p>'}</div>`;
}
